<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cubao Baller Club</title>
  <meta name="description" content="Scores, schedule, standings, stats and teams of the Cubao Baller Club basketball league.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="ticker" id="ticker" aria-label="Scores"></div>
    <div class="bar">
      <a class="brand" href="#home" id="brand"></a>
      <nav class="nav" aria-label="Sections">
        <a href="#home">Home</a>
        <a href="#games">Games</a>
        <a href="#standings">Standings</a>
        <a href="#stats">Stats</a>
        <a href="#teams">Teams</a>
        <a href="#news">News</a>
      </nav>
      <button class="theme" type="button" aria-label="Switch light or dark">◐</button>
    </div>
    <div class="stripe" aria-hidden="true"></div>
  </header>

  <main id="app"></main>

  <footer class="footer" id="footer"></footer>

  <script src="data.js"></script>
  <script>
    // Use the live league from Hooperville when the server can reach it; otherwise the sample in data.js.
    (async () => {
      const sample = window.SITE;
      try {
        const res = await fetch("/api/site-data", { cache: "no-store" });
        const live = res.ok ? await res.json() : null;
        if (live && live.teams && Object.keys(live.teams).length) {
          window.SITE = {
            ...live,
            league: { ...sample.league, season: live.league.season || sample.league.season, city: live.league.city || sample.league.city },
            news: []
          };
        }
      } catch { /* offline or no server: keep the sample */ }
      const app = document.createElement("script");
      app.src = "app.js";
      document.body.appendChild(app);
    })();
  </script>
</body>
</html>
