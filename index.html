<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cubao Ballers Club</title>
  <meta name="description" content="Scores, schedule, standings, stats and teams of the Cubao Ballers Club basketball league.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="ticker" id="ticker" aria-label="Scores"></div>
    <div class="bar">
      <a class="brand" href="#home" id="brand"></a>
      <nav class="nav" aria-label="Sections">
        <a href="#home">Home</a>
        <a href="#games">Games</a>
        <a href="#standings">Standings</a>
        <a href="#stats">Stats</a>
        <a href="#playoffs" hidden>Playoffs</a>
        <a href="#teams">Teams</a>
        <a href="#news">News</a>
        <a href="#signup" class="nav-cta" hidden>Sign up</a>
      </nav>
      <button class="theme" type="button" aria-label="Switch light or dark">◐</button>
    </div>
    <div class="stripe" aria-hidden="true"></div>
  </header>

  <main id="app"></main>

  <!-- Phones: an app-style bar at the bottom, in thumb reach. -->
  <nav class="tabbar" aria-label="Sections">
    <a href="#home" data-tab-for="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
    <a href="#games" data-tab-for="games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Games</span></a>
    <a href="#standings" data-tab-for="standings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="4" cy="6" r=".6"/></svg><span>Standings</span></a>
    <a href="#stats" data-tab-for="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span>Stats</span></a>
    <button type="button" class="more-btn" data-tab-for="more" aria-expanded="false" aria-controls="more-sheet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></button>
  </nav>
  <div class="sheet" id="more-sheet" hidden>
    <a href="#teams">Teams</a>
    <a href="#playoffs" hidden>Playoffs</a>
    <a href="#news">News</a>
    <a href="#signup" class="sheet-cta" hidden>Sign up for next season</a>
    <button type="button" class="sheet-theme">Light / dark</button>
  </div>

  <footer class="footer" id="footer"></footer>

  <script src="data.js"></script>
  <script>
    // Use the live league from Hooperville when the server can reach it; otherwise the sample in data.js.
    (async () => {
      const sample = window.SITE;
      try {
        const res = await fetch("/api/site-data", { cache: "no-store" });
        const live = res.ok ? await res.json() : null;
        if (live && live.teams && Object.keys(live.teams).length) {
          window.SITE = {
            ...live,
            league: { ...sample.league, ...Object.fromEntries(Object.entries(live.league).filter(([, v]) => v)) },
            news: [],
            signup: sample.signup
          };
        }
      } catch { /* offline or no server: keep the sample */ }
      const app = document.createElement("script");
      app.src = "app.js";
      document.body.appendChild(app);
    })();
  </script>
</body>
</html>
